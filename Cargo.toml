[package]
name = "refractor"
version = "0.1.0"
edition = "2024"
description = "A code editor built with the Aimer framework"

[lib]
path = "src/main.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aimer = {git="https://github.com/Cottons29/aimer.git", branch = "main", features = ["provider", "svg", "icons", "native", "markdown", "lottie", "file-picker"] }

# aimer = { path = "../aimer", features = ["provider", "svg", "icons", "native", "markdown", "lottie", "file-picker"] }
arborium = { version = "2.18.0", default-features = false, features = ["lang-rust", "lang-toml", "lang-markdown", "lang-json","lang-html"] }
lsp-types = "=0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse", "display"] }
ignore = "=0.4.34"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"

[profile.dev.package.unicode-segmentation]
opt-level = 3

[profile.dev.package.aimer_simd]
opt-level = 3

[profile.dev.package.arborium]
opt-level = 2
