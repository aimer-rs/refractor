[package]
name = "Refractor"
version = "0.1.0"
description = "A code editor built with the Aimer framework"
author = "Cottons29"
group = "rs.aimer.refractor"

# The kinds of file the app opens: what makes the system offer it a file dropped
# on its icon or chosen in "Open With". macOS reads the extensions, iOS only the
# `utis`, Android the `mime_types` or the extensions.
[[documents]]
name = "Source file"
extensions = ["rs", "toml", "md", "markdown", "txt"]
utis = ["public.source-code", "public.plain-text"]
mime_types = ["text/x-rust", "text/plain"]

# Variable fonts: one file per style serves every weight. Registered in `src/fonts.rs`.
[fonts]
google_sans = "assets/Google_Sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf"
google_sans_italic = "assets/Google_Sans/GoogleSans-Italic-VariableFont_GRAD,opsz,wght.ttf"
jetbrains_mono = "assets/JetBrainsMono-2.304/fonts/variable/JetBrainsMono[wght].ttf"
jetbrains_mono_italic = "assets/JetBrainsMono-2.304/fonts/variable/JetBrainsMono-Italic[wght].ttf"
