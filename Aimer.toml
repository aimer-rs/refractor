[package]
name = "Refractor"
version = "0.1.0"
description = "A code editor built with the Aimer framework"
author = "Cottons29"
group = "rs.aimer.refractor"

# The kinds of file the app opens: what makes the system offer it a file dropped
# on its icon or chosen in "Open With". macOS reads the extensions, iOS only the
# `utis`, Android the `mime_types` or the extensions.
[[documents]]
name = "Source file"
extensions = ["rs", "toml", "md", "markdown", "txt"]
utis = ["public.source-code", "public.plain-text"]
mime_types = ["text/x-rust", "text/plain"]

# A folder dropped on the icon: macOS only offers the app a folder when it declares `public.folder`.
[[documents]]
name = "Folder"
utis = ["public.folder"]

# Variable fonts: one file per style serves every weight. Registered in `src/fonts.rs`.
[fonts]
ui_font = "assets/Inter/Inter-VariableFont_opsz,wght.ttf"
ui_font_italic = "assets/Inter/Inter-Italic-VariableFont_opsz,wght.ttf"
mono_font = "assets/JetBrainsMono-2.304/fonts/variable/JetBrainsMono[wght].ttf"
mono_font_italic = "assets/JetBrainsMono-2.304/fonts/variable/JetBrainsMono-Italic[wght].ttf"


[icons]
source = "assets/icon.png"